name: Manual SDK compile
on:
  workflow_dispatch:
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Validate, test core, build iOS 26 app
        run: |
          python3 scripts/prepare-icons.py
          bash scripts/check.sh
