name: Native iOS
on:
  push:
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE']
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Validate, test core, build iOS 26 app
        run: bash scripts/check.sh
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/yi-simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          data = json.load(open('/tmp/yi-simulators.json'))
          phones = [device for runtime, devices in data['devices'].items() if 'iOS-26-' in runtime for device in devices if device['name'].startswith('iPhone') and device['isAvailable']]
          assert phones, 'Install an iOS 26 iPhone simulator runtime'
          print('YICLASS_SIMULATOR=' + phones[0]['udid'])
          PY
      - name: UI smoke test
        timeout-minutes: 10
        run: xcodebuild -project YIClass.xcodeproj -scheme YIClass -destination "platform=iOS Simulator,id=$YICLASS_SIMULATOR" -derivedDataPath DerivedData -resultBundlePath /tmp/YIClass-UI.xcresult -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test
      - name: Export UI screenshots
        if: always()
        continue-on-error: true
        run: |
          if [[ -d /tmp/YIClass-UI.xcresult ]]; then
            xcrun xcresulttool export attachments --path /tmp/YIClass-UI.xcresult --output-path /tmp/yi-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: /tmp/yi-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-results
          path: /tmp/YIClass-UI.xcresult
