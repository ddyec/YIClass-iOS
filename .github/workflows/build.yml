name: Downloadable iOS builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'YIClass.xcodeproj/**'
      - 'scripts/package-build.sh'
      - 'scripts/verify_build.py'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: downloadable-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Validate project and test core
        run: |
          python3 scripts/validate_project.py
          swift test
          bash scripts/test-pdf.sh
          bash scripts/test-store.sh
      - name: Archive and package iPhone IPA
        run: bash scripts/package-build.sh device
      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: YIClass-iOS26-unsigned-ipa
          path: |
            dist/YIClass-iOS26-unsigned.ipa
            dist/device-manifest.json
            dist/device-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build and package simulator app
        run: bash scripts/package-build.sh simulator
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: YIClass-iOS26-simulator
          path: |
            dist/YIClass-iOS26-simulator.tar.gz
            dist/simulator-manifest.json
            dist/simulator-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YIClass-build-logs
          path: dist/*-build.log
          if-no-files-found: warn
          retention-days: 30
