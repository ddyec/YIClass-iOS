name: Test then Build IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Tests/**'
      - 'YIClass.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: downloadable-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: 1 - Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Validate project and assets
        run: |
          python3 scripts/prepare-icons.py
          python3 scripts/validate_project.py
      - name: Core tests
        run: swift test
      - name: PDF and persistence integration tests
        run: |
          bash scripts/test-pdf.sh
          bash scripts/test-store.sh
      - name: Render production SwiftUI views for visual review
        run: bash scripts/render-visual-review.sh
      - name: Upload review images (not an app package)
        uses: actions/upload-artifact@v4
        with:
          name: Visual-review-images
          path: dist/visual-review/*.png
          if-no-files-found: error
          retention-days: 30
  visual:
    name: 2 - iPhone visual checks (screenshots only)
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Check static glass, selection, collapse and todo layout
        run: bash scripts/test-navigation-visual.sh
      - name: Export iPhone screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path dist/NavigationReview.xcresult --output-path dist/navigation-review/screenshots
      - name: Upload screenshot review (no simulator app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-navigation-screenshots
          path: dist/navigation-review/
          if-no-files-found: warn
          retention-days: 30
  build:
    name: 3 - Build IPA (iPhone and iPad)
    needs: visual
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Prepare icon renditions
        run: python3 scripts/prepare-icons.py
      - name: Archive and package device IPA
        run: bash scripts/package-build.sh device
      - name: Download IPA here
        id: ipa
        uses: actions/upload-artifact@v4
        with:
          name: YIClass-3.2.1-iPhone-iPad-IPA
          path: |
            dist/YIClass-iOS26-resign.ipa
            dist/device-manifest.json
            dist/device-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Put IPA download first in the run summary
        env:
          IPA_ARTIFACT_URL: ${{ steps.ipa.outputs.artifact-url }}
        run: |
          echo '## iPhone / iPad IPA' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download 3.2.1 (22) IPA]($IPA_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests finished before this build. This is the device package; re-sign before installation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Failed-device-build-logs
          path: dist/*-build.log
          if-no-files-found: warn
          retention-days: 30
